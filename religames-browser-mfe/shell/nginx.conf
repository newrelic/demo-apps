server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json;

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;

  location = /health {
    default_type text/plain;
    return 200 'ok';
  }

  # Sourcemaps are intentionally not copied under the served docroot (see the
  # Dockerfile), but this is a belt-and-suspenders guard against ever serving
  # one publicly -- sourcemaps are pulled out manually for upload to NR.
  location ~* \.map$ {
    return 404;
  }

  location /data/ {
    add_header Cache-Control "no-store";
  }

  location /js/ {
    add_header Cache-Control "public, max-age=300";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
