# New Relic Python agent configuration for the ReliState web service.
# Environment variables (NEW_RELIC_*) take precedence over values set here.
# The license key is never stored in this file; supply it via .env.

[newrelic]
monitor_mode = false
distributed_tracing.enabled = true
application_logging.enabled = true
application_logging.forwarding.enabled = true
browser_monitoring.auto_instrument = true
